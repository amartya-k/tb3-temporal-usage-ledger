name: Trial analysis

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Completed Model evaluation Actions run ID
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve exact evaluated task revision
        id: source
        uses: actions/github-script@v7
        env:
          SOURCE_RUN: ${{ inputs.source_run }}
        with:
          script: |
            if (!/^\d+$/.test(process.env.SOURCE_RUN)) throw new Error('Invalid run ID');
            const {data} = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: Number(process.env.SOURCE_RUN)
            });
            if (data.name !== 'Model evaluation' || data.status !== 'completed')
              throw new Error('Select a completed Model evaluation run');
            core.setOutput('sha', data.head_sha);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: source-repo
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: harbor-framework/terminal-bench
          ref: 1dcda8716784493721921c23e4bc7f7d988b4494
          path: tb3
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
          pattern: evaluation-*
          path: source-results
      - uses: astral-sh/setup-uv@v6
      - name: Install pinned Harbor
        run: uv tool install "harbor==$(cat tb3/.github/harbor-version)"
      - name: Analyze recorded trajectories with upstream defaults
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: uv run --with PyYAML==6.0.3 python scripts/analyze_trials.py source-results source-repo
      - name: Prepare evidence
        if: always()
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python scripts/prepare_evidence.py
      - name: Preserve analysis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-${{ inputs.source_run }}
          path: evidence
